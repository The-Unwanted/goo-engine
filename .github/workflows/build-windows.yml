name: Build Goo Engine - Windows

on:
  workflow_dispatch:

concurrency:
  group: goo-engine-windows-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout Goo Engine
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install SVN
        shell: powershell
        run: |
          choco install -y svn --no-progress

          $svnPath = Join-Path $env:ProgramFiles "Subversion\bin"

          if (-not (Test-Path $svnPath)) {
            Write-Error "SVN was not installed at $svnPath"
            exit 1
          }

          $env:Path = "$svnPath;$env:Path"
          $svnPath | Out-File `
            -FilePath $env:GITHUB_PATH `
            -Encoding utf8 `
            -Append

          svn --version --quiet

      - name: Update dependencies
        shell: powershell
        run: |
          $libDir = Join-Path $env:GITHUB_WORKSPACE "..\lib\win64_vc15"
          $libDir = [IO.Path]::GetFullPath($libDir)

          $maxAttempts = 6
          $updateSucceeded = $false

          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "Updating external libraries (attempt $attempt/$maxAttempts)"
            Write-Host "Library directory: $libDir"

            if (Test-Path $libDir) {
              Write-Host "Cleaning SVN working copy..."
              svn cleanup $libDir

              if ($LASTEXITCODE -ne 0) {
                Write-Warning "svn cleanup failed with exit code $LASTEXITCODE"
              }
            }

            Write-Host "Running make.bat update..."

            cmd.exe /D /S /C 'echo y| call make.bat update'
            $exitCode = $LASTEXITCODE

            if ($exitCode -eq 0) {
              $updateSucceeded = $true
              Write-Host "External libraries updated successfully."
              break
            }

            Write-Warning "Dependency update failed with exit code $exitCode."

            if ($attempt -lt $maxAttempts) {
              $delay = [Math]::Min(300, [Math]::Pow(2, $attempt) * 10)

              Write-Host "Retrying in $delay seconds..."
              Start-Sleep -Seconds $delay
            }
          }

          if (-not $updateSucceeded) {
            Write-Error "External library update failed after $maxAttempts attempts."
            exit 1
          }

      - name: Build Goo Engine
        shell: cmd
        run: |
          call make.bat
          if errorlevel 1 exit /b %errorlevel%

      - name: Find Blender executable
        shell: powershell
        run: |
          $exe = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Recurse `
            -Filter blender.exe `
            -File `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $exe) {
            Write-Error "Goo Engine executable was not found."
            exit 1
          }

          Write-Host "Found: $($exe.FullName)"

      - name: Package build
        shell: powershell
        run: |
          $exe = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Recurse `
            -Filter blender.exe `
            -File `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $exe) {
            Write-Error "blender.exe was not found."
            exit 1
          }

          $packagePath = Join-Path `
            $env:GITHUB_WORKSPACE `
            "GooEngine-Windows.zip"

          Compress-Archive `
            -Path "$($exe.Directory.FullName)\*" `
            -DestinationPath $packagePath `
            -Force

          Write-Host "Created package: $packagePath"

      - name: Upload Goo Engine
        uses: actions/upload-artifact@v4
        with:
          name: GooEngine-Windows
          path: GooEngine-Windows.zip
          if-no-files-found: error
