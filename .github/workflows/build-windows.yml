name: Build Goo Engine - Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout Goo Engine
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Download build libraries
        shell: cmd
        run: |
          echo y | call make.bat update

      - name: Build Goo Engine
        shell: cmd
        run: |
          call make.bat

      - name: Find Goo Engine executable
        shell: powershell
        run: |
          $exe = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -Filter blender.exe -File |
            Select-Object -First 1

          if (-not $exe) {
            Write-Error "Goo Engine executable (blender.exe) was not found."
            exit 1
          }

          Write-Host "Found executable:"
          Write-Host $exe.FullName

      - name: Package Goo Engine
        shell: powershell
        run: |
          $exe = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -Filter blender.exe -File |
            Select-Object -First 1

          if (-not $exe) {
            Write-Error "blender.exe was not found."
            exit 1
          }

          $buildFolder = $exe.Directory.FullName
          $zipPath = Join-Path $env:GITHUB_WORKSPACE "GooEngine-Windows.zip"

          Write-Host "Packaging:"
          Write-Host $buildFolder
          Write-Host "Into:"
          Write-Host $zipPath

          Compress-Archive `
            -Path "$buildFolder\*" `
            -DestinationPath $zipPath `
            -Force

          if (-not (Test-Path $zipPath)) {
            Write-Error "The ZIP file was not created."
            exit 1
          }

          Write-Host "Package created successfully."

      - name: Upload Goo Engine
        uses: actions/upload-artifact@v4
        with:
          name: GooEngine-Windows
          path: GooEngine-Windows.zip
          if-no-files-found: error
