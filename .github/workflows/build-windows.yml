name: Build Goo Engine - Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout Goo Engine
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64

      - name: Verify Python
        shell: powershell
        run: |
          if (-not $env:pythonLocation) {
            throw "Python was not installed"
          }

          $python = Join-Path $env:pythonLocation "python.exe"

          if (-not (Test-Path $python)) {
            throw "Python executable was not found at $python"
          }

          "$env:pythonLocation" | Out-File `
            -FilePath $env:GITHUB_PATH `
            -Encoding utf8 `
            -Append

          python --version
          python -c "import sys; print(sys.executable)"

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install SVN
        shell: powershell
        run: |
          choco install -y svn --no-progress

          $svnPath = Join-Path $env:ProgramFiles "Subversion\bin"

          if (Test-Path $svnPath) {
            "$svnPath" | Out-File `
              -FilePath $env:GITHUB_PATH `
              -Encoding utf8 `
              -Append

            $env:Path = "$svnPath;$env:Path"
          }

          where.exe svn
          svn --version --quiet

      - name: Update dependencies
        shell: cmd
        run: |
          where python
          python --version

          echo y| call make.bat update verbose
          if errorlevel 1 exit /b %errorlevel%

      - name: Build Goo Engine
        shell: cmd
        run: |
          call make.bat
          if errorlevel 1 exit /b %errorlevel%

      - name: Find Blender executable
        shell: powershell
        run: |
          $exe = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Recurse `
            -Filter blender.exe `
            -File |
            Select-Object -First 1

          if (-not $exe) {
            throw "Goo Engine executable was not found."
          }

          Write-Host "Found: $($exe.FullName)"

      - name: Package build
        shell: powershell
        run: |
          $exe = Get-ChildItem `
            -Path $env:GITHUB_WORKSPACE `
            -Recurse `
            -Filter blender.exe `
            -File |
            Select-Object -First 1

          if (-not $exe) {
            throw "blender.exe was not found."
          }

          Compress-Archive `
            -Path "$($exe.Directory.FullName)\*" `
            -DestinationPath "$env:GITHUB_WORKSPACE\GooEngine-Windows.zip" `
            -Force

      - name: Upload Goo Engine
        uses: actions/upload-artifact@v4
        with:
          name: GooEngine-Windows
          path: GooEngine-Windows.zip
          if-no-files-found: error
