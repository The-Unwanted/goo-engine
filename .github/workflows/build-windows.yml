name: Build Goo Engine - Windows

on:
workflow_dispatch:

jobs:
build:
runs-on: windows-2022

steps:

- name: Checkout Goo Engine 4.1
uses: actions/checkout@v4
with:
repository: dillongoostudios/goo-engine
ref: goo-engine-v4.1-release
submodules: recursive
fetch-depth: 0

- name: Install Python
uses: actions/setup-python@v5
with:
python-version: "3.11"

- name: Install SVN
shell: powershell
run: |
choco install sliksvn -y --no-progress

- name: Add SVN to PATH
shell: powershell
run: |
latex
svn = "C:\Program Files\SlikSvn\bin" 

env:Path += ";svn" >> $`env:GITHUB_PATH

- name: Check tools
shell: cmd
run: |
python --version
svn --version --quiet
git --version

- name: Setup MSVC
uses: ilammy/msvc-dev-cmd@v1
with:
arch: x64

- name: Download Goo dependencies
shell: cmd
run: |
call make.bat update

- name: Build Goo Engine
shell: cmd
run: |
call make.bat

- name: Locate executable
shell: powershell
run: |
$exe = Get-ChildItem
-Path "$env:GITHUB_WORKSPACE\.."
-Recurse -Filter blender.exe
-File `
-ErrorAction SilentlyContinue |
Select-Object -First 1

if (-not `$exe) {
Write-Error "Goo Engine executable was not found."
exit 1
}

Write-Host ""
Write-Host "Goo Engine found:"
Write-Host $`exe.FullName
Write-Host ""

- name: Package build
shell: powershell
run: |
$exe = Get-ChildItem
-Path "$env:GITHUB_WORKSPACE\.."
-Recurse -Filter blender.exe
-File `
-ErrorAction SilentlyContinue |
Select-Object -First 1

if (-not `$exe) {
Write-Error "blender.exe was not found."
exit 1
}

exe.Directory.FullName

Compress-Archive -Path "$folder*" -DestinationPath "$env:GITHUB_WORKSPACE\GooEngine-Windows.zip" `
-Force

- name: Upload Goo Engine
uses: actions/upload-artifact@v4
with:
name: GooEngine-Windows
path: GooEngine-Windows.zip
if-no-files-found: error
