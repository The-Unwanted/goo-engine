name: Build Goo Engine - Windows

on:
workflow_dispatch:

jobs:
build:
runs-on: windows-2022

steps:
- name: Checkout Goo Engine
uses: actions/checkout@v4
with:
submodules: recursive
fetch-depth: 0

- name: Set up Python
uses: actions/setup-python@v5
with:
python-version: "3.11"

- name: Install SVN
shell: powershell
run: |
choco install sliksvn -y --no-progress
latex
env:Path += ";C:\Program Files\SlikSvn\bin" [Environment]::SetEnvironmentVariable( "Path", 

env:Path,
"Process"
)

- name: Verify SVN
shell: cmd
run: |
svn --version --quiet

- name: Set up MSVC
uses: ilammy/msvc-dev-cmd@v1
with:
arch: x64

- name: Download Goo Engine libraries
shell: cmd
run: |
set "PATH=C:\Program Files\SlikSvn\bin;%PATH%"
echo y | call make.bat update

- name: Build Goo Engine
shell: cmd
run: |
set "PATH=C:\Program Files\SlikSvn\bin;%PATH%"
call make.bat

- name: Find Goo Engine
shell: powershell
run: |
env:GITHUB_WORKSPACE -Recurse
-Filter blender.exe `
-File |
Select-Object -First 1

if (-not $`exe) {
Write-Error "blender.exe was not found."
exit 1
}

Write-Host "Goo Engine found at:"
Write-Host `$exe.FullName

- name: Package Goo Engine
shell: powershell
run: |
env:GITHUB_WORKSPACE -Recurse
-Filter blender.exe `
-File |
Select-Object -First 1

if (-not $`exe) {
Write-Error "blender.exe was not found."
exit 1
}

$folder = $exe.Directory.FullName
$zip = Join-Path $env:GITHUB_WORKSPACE "GooEngine-Windows.zip"

Compress-Archive -Path "$folder*" -DestinationPath $zip `
-Force

Write-Host "Created: `$zip"

- name: Upload Goo Engine
uses: actions/upload-artifact@v4
with:
name: GooEngine-Windows
path: GooEngine-Windows.zip
if-no-files-found: error
