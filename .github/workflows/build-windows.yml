name: Build Goo Engine - Windows

# Builds Goo Engine (Blender 4.1 based, Eevee/NPR) as a portable Windows x64
# package: <dist>/blender.exe + datafiles + python + scripts, zipped.
#
# Differences from the stock Blender "make.bat update && make.bat" flow:
#  * precompiled libraries are fetched directly from Blender's SVN archive
#    into C:\bglib (keeps the small D: drive of the runner free),
#  * CMake + Ninja are driven directly (faster than msbuild, single config),
#  * every long step writes a log, and on failure the log tail is surfaced
#    as workflow annotations + committed to ci-logs/ so it can be inspected.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "prepare = libraries + configure only, build = full build + package"
        required: true
        default: "build"
        type: choice
        options:
          - build
          - prepare

permissions:
  contents: write

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: false

env:
  LIB_DIR: C:\bglib\win64_vc15
  BUILD_DIR: C:\bg\build
  DIST_DIR: C:\bg\dist
  LOG_DIR: C:\bg\logs
  SVN_LIB_URL: https://svn.blender.org/svnroot/bf-blender/tags/blender-4.1-release/lib/win64_vc15

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 355

    steps:
      - name: Checkout Goo Engine
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Environment and logging
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:LOG_DIR | Out-Null
          $log = Join-Path $env:LOG_DIR "environment.log"
          function Say($msg) { $msg | Tee-Object -FilePath $log -Append }

          Say "powershell: $($PSVersionTable.PSVersion)"
          Say "workspace: $env:GITHUB_WORKSPACE"
          Say "cores: $env:NUMBER_OF_PROCESSORS"
          Say "python: $((Get-Command python).Source)"
          Say "cmake: $((Get-Command cmake).Source)"
          Say "ninja: $((Get-Command ninja -ErrorAction SilentlyContinue).Source)"
          Say "git: $((Get-Command git).Source)"
          Say "cl: $((Get-Command cl -ErrorAction SilentlyContinue).Source)"
          Get-PSDrive C, D -ErrorAction SilentlyContinue | ForEach-Object {
            Say ("drive {0}: {1:N1} GB free of {2:N1} GB" -f $_.Name, ($_.Free / 1GB), (($_.Used + $_.Free) / 1GB))
          }
          $ram = (Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory / 1GB
          Say ("ram: {0:N1} GB" -f $ram)
          & cl 2>&1 | Select-Object -First 1 | ForEach-Object { Say "compiler: $_" }
          & cmake --version | Select-Object -First 1 | ForEach-Object { Say "cmake: $_" }
          & git --version | ForEach-Object { Say "git: $_" }
          Say "done"

      - name: Install tools
        shell: pwsh
        run: |
          $log = Join-Path $env:LOG_DIR "install-tools.log"
          function Emit-Fail($reason) {
            Write-Host "::error::$reason"
            Get-Content $log -Tail 25 -ErrorAction SilentlyContinue | ForEach-Object {
              $line = "$_".TrimEnd()
              if ($line.Length -gt 900) { $line = $line.Substring(0, 900) }
              if ($line) { Write-Host "::error::$line" }
            }
            exit 1
          }

          function Add-ToolPath($dir) {
            if (-not $dir) { return }
            if (Test-Path $dir) {
              $env:Path = "$dir;$env:Path"
              $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            }
          }

          # Preinstalled copies first (the windows-2022 image ships both).
          Add-ToolPath "C:\ProgramData\chocolatey\bin"
          Add-ToolPath "C:\Program Files\Git\usr\bin"

          if (-not (Get-Command svn -ErrorAction SilentlyContinue)) {
            Write-Host "::notice::svn not on PATH, installing via chocolatey"
            choco install -y svn --no-progress *>&1 | Tee-Object -FilePath $log -Append
            Write-Host "choco svn exit code: $LASTEXITCODE" | Tee-Object -FilePath $log -Append
            Add-ToolPath "C:\ProgramData\chocolatey\bin"
            if (-not (Get-Command svn -ErrorAction SilentlyContinue)) {
              $found = Get-ChildItem "C:\Program Files" -Filter "svn.exe" -Recurse -ErrorAction SilentlyContinue |
                Select-Object -First 1
              if ($found) { Add-ToolPath $found.DirectoryName }
            }
          }

          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            Write-Host "::notice::ninja not on PATH, installing via chocolatey"
            choco install -y ninja --no-progress *>&1 | Tee-Object -FilePath $log -Append
            Write-Host "choco ninja exit code: $LASTEXITCODE" | Tee-Object -FilePath $log -Append
            Add-ToolPath "C:\ProgramData\chocolatey\bin"
          }

          $svn = Get-Command svn -ErrorAction SilentlyContinue
          $ninja = Get-Command ninja -ErrorAction SilentlyContinue
          if (-not $svn) { Emit-Fail "svn is not available after installation attempts" }
          if (-not $ninja) { Emit-Fail "ninja is not available after installation attempts" }
          Write-Host "::notice::svn=$($svn.Source) ninja=$($ninja.Source)"
          & svn --version --quiet | ForEach-Object { Write-Host "::notice::svn version $_" }
          & ninja --version | ForEach-Object { Write-Host "::notice::ninja version $_" }

      - name: Cache precompiled libraries
        id: libcache
        uses: actions/cache@v4
        with:
          path: C:\bglib\win64_vc15
          key: goo-libs-win64-vc15-4.1-v1

      - name: Fetch precompiled libraries (SVN)
        if: steps.libcache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $log = Join-Path $env:LOG_DIR "svn-checkout.log"
          New-Item -ItemType Directory -Force -Path (Split-Path $env:LIB_DIR) | Out-Null

          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Write-Host "::notice::SVN checkout attempt $attempt of 3"
            & svn checkout --non-interactive --no-auth-cache $env:SVN_LIB_URL $env:LIB_DIR *>&1 |
              Tee-Object -FilePath $log -Append
            if ($LASTEXITCODE -eq 0) { break }

            Write-Host "::warning::SVN checkout failed with exit code $LASTEXITCODE"
            if (Test-Path $env:LIB_DIR) { & svn cleanup $env:LIB_DIR *>&1 | Out-Null }
            if ($attempt -eq 3) {
              Get-Content $log -Tail 40 | ForEach-Object {
                $line = "$_".TrimEnd()
                if ($line.Length -gt 900) { $line = $line.Substring(0, 900) }
                if ($line) { Write-Host "::error::$line" }
              }
              exit 1
            }
            Start-Sleep -Seconds 20
          }

          $size = (Get-ChildItem $env:LIB_DIR -Recurse -File | Measure-Object -Property Length -Sum).Sum / 1GB
          Write-Host ("::notice::libraries fetched: {0:N2} GB" -f $size)

      - name: Verify libraries
        shell: pwsh
        run: |
          $log = Join-Path $env:LOG_DIR "verify-libs.log"
          $probes = @(
            "python\bin\python.exe",
            "python\include\Python.h",
            "ffmpeg\lib\avcodec.lib",
            "openexr\lib\Iex-3_1.lib",
            "tbb\lib\tbb.lib"
          )
          $missing = @()
          foreach ($probe in $probes) {
            if (-not (Test-Path (Join-Path $env:LIB_DIR $probe))) { $missing += $probe }
          }
          Get-ChildItem $env:LIB_DIR -Directory -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty Name | Sort-Object |
            ForEach-Object { Write-Host "::notice::lib subdir $_" } | Out-Null
          Get-ChildItem $env:LIB_DIR -Directory -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty Name | Sort-Object | Set-Content $log

          if ($missing.Count -gt 0) {
            Write-Host "::error::library directory incomplete, missing: $($missing -join ', ')"
            exit 1
          }
          Write-Host "::notice::library probes OK"

      - name: Configure (CMake + Ninja)
        shell: pwsh
        run: |
          $log = Join-Path $env:LOG_DIR "configure.log"
          & cmake -S $env:GITHUB_WORKSPACE -B $env:BUILD_DIR -G Ninja `
            -C "$env:GITHUB_WORKSPACE\build_files\cmake\config\blender_release.cmake" `
            -DCMAKE_BUILD_TYPE=Release `
            -DLIBDIR="$env:LIB_DIR" `
            -DCMAKE_INSTALL_PREFIX="$env:DIST_DIR" `
            -DWITH_INSTALL_PORTABLE=ON `
            -DWITH_WINDOWS_PDB=OFF `
            -DWITH_WINDOWS_STRIPPED_PDB=OFF `
            -DWITH_GTESTS=OFF `
            -DWITH_BUILDINFO=OFF *>&1 | Tee-Object -FilePath $log

          if ($LASTEXITCODE -ne 0) {
            Get-Content $log -Tail 40 | ForEach-Object {
              $line = "$_".TrimEnd()
              if ($line.Length -gt 900) { $line = $line.Substring(0, 900) }
              if ($line) { Write-Host "::error::$line" }
            }
            exit 1
          }

          Select-String -Path (Join-Path $env:BUILD_DIR "CMakeCache.txt") `
            -Pattern "^(LIBDIR|CMAKE_INSTALL_PREFIX|WITH_CYCLES|WITH_OPENVDB)" |
            ForEach-Object { Write-Host "::notice::$($_.Line)" }

      - name: Build
        if: inputs.mode == 'build'
        shell: pwsh
        run: |
          $log = Join-Path $env:LOG_DIR "build.log"
          $sw = [Diagnostics.Stopwatch]::StartNew()
          & cmake --build $env:BUILD_DIR --target install --parallel 4 *>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          Write-Host ("::notice::build finished in {0:N1} min (exit {1})" -f $sw.Elapsed.TotalMinutes, $code)

          if ($code -ne 0) {
            Select-String -Path $log -Pattern "error C[0-9]+|fatal error|FAILED: " |
              Select-Object -First 25 | ForEach-Object {
                $line = $_.Line.TrimEnd()
                if ($line.Length -gt 900) { $line = $line.Substring(0, 900) }
                Write-Host "::error::[$($_.LineNumber)] $line"
              }
            Get-Content $log -Tail 30 | ForEach-Object {
              $line = "$_".TrimEnd()
              if ($line.Length -gt 900) { $line = $line.Substring(0, 900) }
              if ($line) { Write-Host "::error::$line" }
            }
            exit 1
          }

      - name: Verify and package
        if: inputs.mode == 'build'
        shell: pwsh
        run: |
          $log = Join-Path $env:LOG_DIR "package.log"
          $exe = Join-Path $env:DIST_DIR "blender.exe"
          if (-not (Test-Path $exe)) {
            Write-Host "::error::blender.exe missing in dist dir"
            Get-ChildItem $env:DIST_DIR -ErrorAction SilentlyContinue | Select-Object -First 30 |
              ForEach-Object { Write-Host "::notice::dist entry $($_.Name)" }
            Get-ChildItem $env:BUILD_DIR -Filter "blender*.exe" -Recurse -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host "::notice::built exe candidate $($_.FullName)" }
            exit 1
          }

          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash
          $sizeMb = (Get-Item $exe).Length / 1MB
          Write-Host ("::notice::blender.exe {0:N1} MB sha256={1}" -f $sizeMb, $hash)

          $version = & $exe --version *>&1 | Select-Object -First 3
          $version | ForEach-Object { Write-Host "::notice::version: $_" }

          $distMb = (Get-ChildItem $env:DIST_DIR -Recurse -File | Measure-Object -Property Length -Sum).Sum / 1MB
          Write-Host ("::notice::dist size {0:N0} MB" -f $distMb)

          $zip = Join-Path $env:GITHUB_WORKSPACE "GooEngine-Windows-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path (Join-Path $env:DIST_DIR "*") -DestinationPath $zip -CompressionLevel Optimal
          $zipMb = (Get-Item $zip).Length / 1MB
          Write-Host ("::notice::zip {0:N0} MB" -f $zipMb)

          @(
            "blender.exe: $([math]::Round($sizeMb,1)) MB",
            "sha256: $hash",
            "dist: $([math]::Round($distMb,0)) MB",
            "zip: $([math]::Round($zipMb,0)) MB",
            ("version: " + ($version -join ' | ')),
            "commit: $env:GITHUB_SHA",
            "run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          ) | Set-Content (Join-Path $env:GITHUB_WORKSPACE "GooEngine-Windows-x64.txt")

      - name: Upload package
        if: inputs.mode == 'build'
        uses: actions/upload-artifact@v4
        with:
          name: GooEngine-Windows-x64
          path: |
            GooEngine-Windows-x64.zip
            GooEngine-Windows-x64.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        if: inputs.mode == 'build'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "goo-engine-windows-latest"
          $notes = Get-Content (Join-Path $env:GITHUB_WORKSPACE "GooEngine-Windows-x64.txt") -Raw
          $null = gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "GooEngine-Windows-x64.zip" --clobber
            if ($LASTEXITCODE -ne 0) { Write-Host "::warning::release asset upload failed" }
          } else {
            gh release create $tag "GooEngine-Windows-x64.zip" `
              --title "Goo Engine - Windows x64 build" --notes $notes
            if ($LASTEXITCODE -ne 0) { Write-Host "::warning::release creation failed" }
          }

      - name: Upload logs on failure
        if: failure()
        shell: pwsh
        continue-on-error: true
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE "ci-logs\build-failure.txt"
          New-Item -ItemType Directory -Force -Path (Split-Path $out) | Out-Null
          "Goo Engine Windows build failure" | Set-Content $out
          "run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" | Add-Content $out
          "commit: $env:GITHUB_SHA" | Add-Content $out
          "" | Add-Content $out
          Get-ChildItem $env:LOG_DIR -Filter *.log -ErrorAction SilentlyContinue | ForEach-Object {
            "===== $($_.Name) (tail 250) =====" | Add-Content $out
            Get-Content $_.FullName -Tail 250 | ForEach-Object {
              $line = "$_"
              if ($line.Length -gt 2000) { $line = $line.Substring(0, 2000) }
              $line | Add-Content $out
            }
            "" | Add-Content $out
          }
          git config user.name "goo-ci"
          git config user.email "goo-ci@users.noreply.github.com"
          git add -f ci-logs/build-failure.txt
          git commit -m "CI: record Windows build failure log [skip ci]"
          git push
